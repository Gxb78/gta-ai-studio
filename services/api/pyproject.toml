[project]
name = "gta-studio-api"
version = "0.7.2"
description = "Local FastAPI backend with Phase 7 creative package generation for GTA AI Studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<1",
  "gta-ai-contracts",
  "numpy>=2.4,<3",
  "onnxruntime>=1.27,<2",
  "opencv-python>=4.12,<6",
  "pydantic-settings>=2.13,<3",
  "rapidocr>=3.9,<4",
  "uvicorn[standard]>=0.42,<1",
]

[project.scripts]
gta-studio-api = "gta_studio_api.sidecar:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pyinstaller>=6.19,<7",
  "pytest>=8.4,<9",
]

[tool.uv.sources]
gta-ai-contracts = { path = "../../packages/contracts/python", editable = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gta_studio_api"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../../tests/integration/api"]
