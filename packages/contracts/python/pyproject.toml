[project]
name = "gta-ai-contracts"
version = "0.1.0"
description = "Pydantic boundary contracts for GTA AI Studio"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gta_ai_contracts"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../../../tests/unit/python"]

