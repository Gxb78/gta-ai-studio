[package]
name = "gta-studio"
version = "0.1.0"
description = "Éditeur de montage local ultra-fluide pour rushs GTA (format TikTok)"
authors = ["GTA Studio"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
